# ResearchWiki 运行配置（骨架阶段仅 mock；真模型接入时改这里，不动代码）

[server]
# mock = 演示模式（默认，行为与阶段 1 完全一致，无 key 可跑）；
# real = 走真实 agent loop，但还要求 [llm.strong].base_url 非空，否则自动回退 mock。
mode = "mock"

[mock]
# 演示事件间停顿秒数
delay = 0.04

[llm]
# strong / cheap / judge 三档，OpenAI 兼容协议（POST {base_url}/chat/completions，SSE 流式）。
# base_url 留空 = mock 模式：无需 API key，全链路可跑（router 返回 MockProvider）。
# key 放到 api_key_env 指定的环境变量（写在项目根 .env 即可，.env 已 gitignore）。
# 下面是智谱的可用组合；换厂商只改 model / base_url，不动代码，例如：
#   SiliconFlow  https://api.siliconflow.cn/v1        （Qwen3 / DeepSeek-V3 等）
#   DeepSeek     https://api.deepseek.com/v1          （deepseek-chat）
#   Kimi         https://api.moonshot.cn/v1           （kimi-k2-*）

[llm.strong]
# 主循环（规划 / 综述报告）。当前用便宜档以控制成本；
# 想换更强的规划与综述：把 model 改成 "glm-4.7"（贵、慢、质量更高），代码不用动。
model = "glm-4.5-air"
base_url = "https://open.bigmodel.cn/api/paas/v4"
api_key_env = "RESEARCHWIKI_STRONG_API_KEY"

[llm.cheap]
# 子 agent 检索阅读 / 笔记蒸馏。这一档用得最多，保持便宜模型。
model = "glm-4.5-air"
base_url = "https://open.bigmodel.cn/api/paas/v4"
api_key_env = "RESEARCHWIKI_CHEAP_API_KEY"

[llm.judge]
# 评测判官（evals/judge.py）：给候选回答按 rubric 打三维分
# （coverage 覆盖度 / citation 引用相符 / temporal 时效性，各 1–5）。
# 评审必须强于被测模型——被测用 glm-4.5-air 时 judge 配 glm-4.7；
# 被测模型升级时 judge 也要跟着换成更强的，否则评分没有区分度。
# 成本口径：每题一次 judge 调用（一次打齐三维分，记账 step="evals:judge"）。
# base_url 留空 = mock judge：测试与无 key 场景自动回退 MockProvider，
# 分数无意义（仅用于管线测试，真实评测必须配强模型）。
model = "glm-4.7"
base_url = "https://open.bigmodel.cn/api/paas/v4"
api_key_env = "RESEARCHWIKI_JUDGE_API_KEY"

[runtime]
# 上下文超过窗口该比例触发 compaction（阶段 3）
compaction_threshold = 0.7

[embedding]
# 检索索引的向量通道（OpenAI 兼容 POST {base_url}/embeddings）。
# base_url 或 model 留空 = MockEmbeddingProvider：确定性 bigram 特征哈希，
# 无需 key、零网络，测试与演示全链路可跑（与 llm 路由同一 skeleton-first 哲学）。
# 换厂商同样只改 model / base_url：SiliconFlow 用 "BAAI/bge-m3"，OpenAI 用 "text-embedding-3-small"
model = "embedding-3"
base_url = "https://open.bigmodel.cn/api/paas/v4"
api_key_env = "RESEARCHWIKI_EMBEDDING_API_KEY"

[wiki]
# 关键词索引 tokenizer：auto（优先探测 vendor 的 simple+jieba 词库，失败退 trigram）|
# simple | trigram。本地缓存命中嵌入向量存 wiki-data/index.db（与索引同库）。
fts_tokenizer = "auto"
# 新鲜度半衰期（天）：volatile 每 30 天检索分衰减一半，drifting 90 天，stable 不衰减
half_life_days = { volatile = 30, drifting = 90 }
# 入库去重（轻量 merge）：候选笔记与既有 active 笔记「向量余弦 ≥ dedup_similarity
# 且实体重叠 ≥ dedup_entity_overlap」时判为重复 → 合并进既有笔记（保留其规范 ID，
# 新证据并入 sources，并写一条 status=merged + redirect_to 的留痕记录）。
# 向量用 [embedding] 段的模型（留空 = 确定性 Mock）；实体名按 slugify 归一后比较。
dedup_similarity = 0.9
dedup_entity_overlap = 1

[prior]
# Prior 注入（阶段 1）：run 开始前对问题检索历史 Wiki 的 active 笔记（索引落后
# 先整体 rebuild），以"仅供核验"标签块注入规划上下文。Prior 的 URL 不进本轮
# 来源池、不占报告 [n] 编号，只作核验比对；缺省段 = enabled + 默认值。
# enabled = false 时完全不检索不注入；top_k 最多注入条数；max_chars 注入块字符预算。
enabled = true
top_k = 5
max_chars = 4000

[freshness]
# 时间感知的记忆有效性判定（P2 / RQ2）：`researchwiki lint` 用它对 active 笔记
# 算 fresh / review_due / stale 三态分布与待复核队列（只统计提示，不影响退出码）。
# 半衰期不在本段：沿用上面的 [wiki].half_life_days（检索打分与时效判定同口径），
# 需要单独覆盖时可以在这里再写一次 half_life_days = { volatile = 30, drifting = 90 }。
# decay 降到 review_due_ratio 即判"该复核"，降到 stale_ratio 即判"该废止"（闭区间）。
review_due_ratio = 0.5
stale_ratio = 0.25

# 可选：按记忆载体类型覆盖上面的参数（kind = knowledge / user / experience）。
# 示例（默认注释掉，不改变默认行为）：用户画像变化慢，放宽复核阈值。
# [freshness.user]
# review_due_ratio = 0.7

[formation]
# 记忆形成（RQ1：什么时候应该记住）：run 内蒸馏候选入库前过确定性判定——
# 正文过短 / knowledge 无来源 / importance 低于阈值 / 与既有 active 记忆相似度
# ≥ near_duplicate_similarity（近乎重复）的候选拒绝入库、只计数，其余按权重表
# 赋 importance（0.0–1.0，规则见 wiki/formation.py docstring）后入库，判定理由
# 写进笔记 extra.formation_reason。只约束自动入库路径；显式写入（MCP memory.store）
# 不经 formation。enabled = false 为逃生阀：全部候选照旧入库（拒绝恒 0）。
enabled = true
# 正文最短字符数（strip 后，低于即拒绝）
min_body_chars = 20
# knowledge 类候选是否必须带至少一个来源（MVP 恒按 knowledge 判定）
require_source_for_knowledge = true
# importance 低于该值不入库（0.0–1.0）
min_importance_to_persist = 0.3
# 与既有 active 记忆的最大相似度达到该值视为近乎重复，拒绝入库
near_duplicate_similarity = 0.95

[verification]
# 旧记忆 vs 新证据的结构化比较阈值（P2-C，wiki/verification.py）：研究 run 收尾的
# "记忆更新"阶段用它判定命中 Prior 该怎么处置。半衰期/新鲜度不在本段（那在
# [freshness] 与 [wiki].half_life_days）。缺省段 = 模块默认值（同下）。
# 这里的相似度是**判定层自带的确定性度量**（bigram 特征哈希余弦，零网络、可复算），
# 与 [wiki].dedup_similarity（入库去重，走 [embedding] 段模型）以及 formation 的
# near_duplicate_similarity **不是同一尺度**，数值不可直接比较：本段阈值在这套
# 度量上独立标定（若将来要求与检索侧同尺度，需要把 embedding provider 注入判定层、
# 放弃零模型调用——那是一次显式取舍，见 wiki/verification.py docstring）。
# similarity_floor：相似度地板，低于它直接判 uncertain（不做任何比较，也不调用
#   语义判官——地板存在的意义就是不让无关证据消耗比较器）；
# consistent_similarity：断言重述的相似度阈值，达到且槽位级取值逐一对得上才判
#   consistent（只刷新 reviewed_at）；被夹到不低于 similarity_floor。
similarity_floor = 0.3
consistent_similarity = 0.8
# supersede_min_similarity：**替换门**（终审 F2 监察者裁定）——相似度低于它的证据
#   不得判 newer/supersede（落 uncertain）："时间更晚"不是覆盖旧记忆的充分条件，
#   主题相邻、facet 不同的更晚证据（实体为空时实体护栏也不设防）曾经能覆盖仍然有效
#   的旧记忆。只约束替换类覆盖动作；冲突（开台账，保守动作）与 merge（保留规范 ID）
#   不受它约束。小于 similarity_floor 时被夹到 floor。
supersede_min_similarity = 0.6
# similarity_dim：比较用的确定性 bigram 特征哈希向量维度（与 [embedding] 无关，
#   判定必须零网络、可复算）
similarity_dim = 128
# context_chars：冲突槽位的上下文锚点长度（越大越容易落进不同槽位、越不容易判冲突）
context_chars = 6

[memory_update]
# 记忆更新（RQ2 闭环，P2-E）：run 收尾时把本轮蒸馏入库的候选当新证据，与 plan 阶段
# 命中的 Prior 逐条比较（[verification] 阈值），按判定执行动作——
# 一致 → 刷新 reviewed_at；更新 → supersede（带来源）；更具体 → 并入正文与来源；
# 冲突 → 开冲突台账；uncertain → 不做动作。结果写 state.md 一行与
# run_dir/memory-update.json（不改 run-metrics 契约）。
# enabled = false 是逃生阀：阶段照常留痕（state.md 写明已禁用）、零写盘动作；
# dry_run = true 是影子模式：判定与分派照跑，但不落任何笔记/台账（先观察再放行）。
enabled = true
dry_run = false

[retrieval]
# 动态检索策略（P3 / RQ3）：不是每个问题都召回同样多、同样深的记忆。
# run 开始时先做一次探测检索（probe_k 条），从命中里算确定性特征——
# coverage（命中数/分数）、freshness（fresh/review_due/stale 计数）、
# volatility（volatile 命中）、uncertainty（低置信命中 + open 冲突相关度）、
# budget（剩余 token 比例）——按守卫红线 > 覆盖度 > 预算降级的顺序判定模式：
#   simple → 直接回答或轻量检索（不 fresh 搜索，只读少量 Prior）
#   update → 读取旧记忆 + 少量 fresh verification
#   deep   → 预算完整的研究 loop（与 P2 现状等价）
# 红线：stale / conflict / 低置信旧记忆不得被路由为 simple（无需搜索）。
# 每次判定写入 run_dir/policy.json（features + reasons + limits），可复算可审计。
# enabled = false 为逃生阀：行为回到 P2 单一 deep 路径，不判定不留痕。
enabled = true
# 探测检索条数（特征来源，不直接等于注入条数）
probe_k = 8
# 判定阈值（确定性规则，评测期校准）
conflict_similarity = 0.3
coverage_min_hits = 2
coverage_min_score = 0.010
budget_floor = 0.15
# time_budget_seconds = 600   # 可选：判定耗时超它降一级；缺省不启用
# forced_mode = "simple"      # 可选：冒烟/评测钉死模式（仍记录 features+reasons）

[retrieval.simple]
prior_k = 3
prior_max_chars = 1200
max_fresh_searches = 0
max_steps = 3
subagents = false
report_style = "brief"
min_fresh_sources = 0

[retrieval.update]
prior_k = 5
prior_max_chars = 4000
max_fresh_searches = 2
max_steps = 6
subagents = false
report_style = "standard"
min_fresh_sources = 1

[retrieval.deep]
prior_k = 5
prior_max_chars = 4000
max_fresh_searches = 4
max_steps = 12
subagents = true
report_style = "full"
min_fresh_sources = 0
