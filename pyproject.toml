[project]
name = "researchwiki"
version = "0.1.0"
description = "自进化研究 Wiki 智能体：长程搜索、蒸馏沉淀个人 wiki，复用越用越快越准"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "trafilatura>=2.2.0",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
researchwiki = "researchwiki.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchwiki"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
